spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.format_sql=true
jwt.secret=my-super-secret-key-for-hmac-and-length-almost-256-bits
server.port=8086